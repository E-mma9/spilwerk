<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spilwerk flyer · ACHTERZIJDE
  Formaat: 111mm × 154mm (A6 105×148 met 3mm bleed rondom)
  Veilige zone: 9mm vanaf de rand (3mm bleed + 6mm marge)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="111mm" height="154mm"
     viewBox="0 0 111 154">

  <!-- Achtergrond -->
  <rect width="111" height="154" fill="#FBF6EE"/>

  <!-- ─── Waarmee ik je help ─── -->
  <text x="9.5" y="18" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="6" font-weight="800" letter-spacing="-0.15" fill="#2A2A28">Waarmee ik je help</text>

  <text font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="4.2" font-weight="500" fill="#4F4D48">
    <tspan x="9.5" y="29">Kort gezegd: alles rond computers,</tspan>
    <tspan x="9.5" y="35.4">internet, telefoons en tablets.</tspan>
    <tspan x="9.5" y="45.5">Van een trage laptop tot foto's die je</tspan>
    <tspan x="9.5" y="51.9">niet wilt verliezen — en alles</tspan>
    <tspan x="9.5" y="58.3">daartussenin. Iets anders? Bel gerust.</tspan>
  </text>

  <rect x="7.6" y="63.5" width="61" height="8.6" rx="4.3" fill="#4A7C59"/>
  <text x="12.2" y="69.4" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="4" font-weight="700" fill="#FBF6EE">Lukt het niet? Geen kosten</text>

  <line x1="9.5" y1="78" x2="101.5" y2="78" stroke="#E8DDC4" stroke-width="0.4"/>

  <!-- ─── Wat het kost ─── -->
  <text x="9.5" y="88" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="6" font-weight="800" letter-spacing="-0.15" fill="#2A2A28">Wat het kost</text>

  <rect x="7.6" y="92.5" width="95.8" height="11.4" rx="2.6" fill="#DCE9DD"/>
  <text x="11.5" y="100.1" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="3.9" font-weight="600" fill="#2A2A28">Eerste uur bij je thuis in Twente</text>
  <text x="98.5" y="100.7" text-anchor="end" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="7" font-weight="800" fill="#36603F">€60</text>

  <g font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="3.7" font-weight="500" fill="#4F4D48">
    <text x="9.9" y="110.8">Daarna per kwartier</text>
    <text x="101.2" y="110.8" text-anchor="end" font-size="3.9" font-weight="700" fill="#2A2A28">€15</text>
    <line x1="9.5" y1="113.9" x2="101.5" y2="113.9" stroke="#E8DDC4" stroke-width="0.3" stroke-dasharray="0.9,0.9"/>

    <text x="9.9" y="120.1">Hulp op afstand</text>
    <text x="101.2" y="120.1" text-anchor="end" font-size="3.9" font-weight="700" fill="#2A2A28">€45 / uur</text>
    <line x1="9.5" y1="123.2" x2="101.5" y2="123.2" stroke="#E8DDC4" stroke-width="0.3" stroke-dasharray="0.9,0.9"/>

    <text x="9.9" y="129.4">Buiten Twente (Zwolle, Deventer e.o.)</text>
    <text x="101.2" y="129.4" text-anchor="end" font-size="3.9" font-weight="700" fill="#2A2A28">+€30</text>
  </g>

  <!-- ─── Contact ─── -->
  <rect x="7.6" y="134.5" width="95.8" height="13" rx="2.6" fill="#F4EBDA"/>
  <circle cx="15.6" cy="141" r="2.5" fill="#4A7C59"/>
  <text x="20.6" y="140.3" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="4.6" font-weight="800" letter-spacing="-0.08" fill="#2A2A28">Spilwerk · 06-87433537</text>
  <text x="20.6" y="145" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="2.9" font-weight="500" fill="#4F4D48">IT-hulp aan huis · heel Overijssel · bel of app gerust</text>

</svg>
