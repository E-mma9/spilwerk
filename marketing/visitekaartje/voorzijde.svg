<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spilwerk visitekaartje · VOORZIJDE
  Formaat: 91mm × 61mm (85×55 met 3mm bleed rondom)
  Veilige zone: 6mm naar binnen vanaf de rand
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="91mm" height="61mm"
     viewBox="0 0 91 61">

  <defs>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8865B" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#E8865B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Achtergrond (paper-crème) -->
  <rect width="91" height="61" fill="#FBF6EE"/>
  <ellipse cx="86" cy="4" rx="30" ry="22" fill="url(#cardGlow)"/>

  <!-- Merkmark: ring + crème centrum (conform logo.svg, ratio 14:5) -->
  <circle cx="11.4" cy="14" r="2.6" fill="#4A7C59"/>
  <circle cx="11.4" cy="14" r="0.93" fill="#FBF6EE"/>

  <!-- Wordmark -->
  <text x="16.6" y="16.3"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="7" font-weight="800"
        letter-spacing="-0.18"
        fill="#2A2A28">Spilwerk</text>

  <!-- Subtitle -->
  <text x="16.8" y="21"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="2.9" font-weight="500"
        fill="#807D75">IT-hulp aan huis · heel Overijssel</text>

  <!-- Belofte -->
  <text x="8" y="32.5"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="3.4" font-weight="700"
        fill="#2A2A28">Computers · internet · telefoons</text>
  <text x="8" y="37.3"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="2.8" font-weight="500"
        fill="#807D75">en alles daartussenin</text>

  <!-- Decoratieve accent-lijn -->
  <line x1="8" y1="42.5" x2="22" y2="42.5"
        stroke="#4A7C59" stroke-width="0.5" stroke-linecap="round"/>

  <!-- Telefoon (primaire CTA) + website -->
  <text x="8" y="52.5"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="6" font-weight="800" letter-spacing="-0.08"
        fill="#2A2A28">06-87433537</text>
  <text x="83" y="52.5" text-anchor="end"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="3.1" font-weight="600"
        fill="#4A7C59">spilwerk.nl</text>

</svg>
