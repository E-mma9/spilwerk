<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spilwerk logo · volledige lockup (mark + wordmark horizontaal)
  Voor: site-header, brieven, presentaties, e-mailhandtekening, signage.
  Voor kleinere placements (avatar, favicon): gebruik logo.svg.

  Verhoudingen (vast):
  - Mark: outer r=22, inner r=8 (zelfde 14:5 ratio als logo.svg)
  - Wordmark: Manrope 800, ink (#2A2A28), letter-spacing -0.6
  - Mark-naar-wordmark gap: 14 units

  Achtergrond: transparant. Plaatsen op crème (#FBF6EE) of lichte achtergrond.
  Voor donkere achtergronden: gebruik nog niet beschikbare inverted-variant
  (zie BRAND.md TODO — vraag mij als je 'm nodig hebt).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="250" height="60"
     viewBox="0 0 250 60">
  <!-- Spil-merkmark -->
  <circle cx="30" cy="30" r="22" fill="#4A7C59"/>
  <circle cx="30" cy="30" r="8" fill="#FBF6EE"/>

  <!-- Wordmark -->
  <text x="66" y="42"
        font-family="Manrope, 'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="800"
        letter-spacing="-0.6"
        fill="#2A2A28">Spilwerk</text>
</svg>
