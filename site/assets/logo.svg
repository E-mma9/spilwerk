<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spilwerk logo · merkmark (standalone)
  Twee concentrische cirkels: groene ring + crème centrum.
  De "spil" in Spilwerk — een draai-as, een pivot, een hub.

  Gebruik:
  - Favicon, GBP-profielfoto, Marktplaats-avatar, social-media profile
  - Plaatsen waar geen ruimte is voor het volledige lockup
  - Standalone — niet naast "Spilwerk"-tekst weergeven (gebruik dan logo-lockup.svg)

  Verhoudingen (vast — niet wijzigen):
  - Outer radius : Inner radius = 14 : 5  (~36% inner)
  - Achtergrond mag transparant of crème (#FBF6EE) zijn

  Kleuren:
  - Ring:    #4A7C59  (Spilwerk groen)
  - Centrum: #FBF6EE  (paper-crème)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="#4A7C59"/>
  <circle cx="16" cy="16" r="5" fill="#FBF6EE"/>
</svg>
